[package]
name = "ahutong-sdk"
version = "0.1.0"
edition = "2024"

[lib]
name = "ahutong_rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
url = { version = "2.4", optional = true }
bytes = { version = "1", optional = true }
regex = { version = "1.12.2", optional = true }
urlencoding = { version = "2.1.3", optional = true }
sha2 = { version = "0.10.9", optional = true }
ed25519-dalek = { version = "2.2.0", optional = true }
hex = { version = "0.4.3", optional = true }
base64 = { version = "0.22.1", optional = true }
guixu = { path = "../GuiXu-Rust", optional = true }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["rustls-tls", "cookies", "json", "multipart", "gzip"] }
tokio = { version = "1", optional = true, features = ["full"] }
reqwest_cookie_store = { version = "0.9.0", optional = true }
cookie_store = { version = "0.22.0", optional = true }
jni = "0.21.1"
android_logger = "0.13"
env_logger = "0.11"
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
rand = { version = "0.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["json", "multipart"] }
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
tokio = { version = "1", optional = true, features = ["sync"] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3.69"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[features]
default = ["legacy"]
# The original API remains available to existing SDK consumers. Plugin builds
# explicitly disable defaults and select exactly one domain or storage-migration.
legacy = ["domain-account", "domain-schedule", "domain-grades", "domain-campus-card", "domain-guide", "storage", "dep:sha2", "dep:ed25519-dalek", "dep:hex", "dep:base64"]
network = ["dep:reqwest", "dep:tokio", "dep:reqwest_cookie_store", "dep:cookie_store", "dep:url"]
domain-account = ["network", "dep:regex", "dep:bytes"]
domain-schedule = ["network", "dep:regex"]
domain-grades = ["network", "dep:regex"]
domain-campus-card = ["network", "dep:regex", "dep:urlencoding"]
domain-guide = ["network"]
storage = ["dep:guixu"]
storage-migration = ["storage"]
server = ["legacy", "axum", "tower-http", "dep:tower", "dep:rand"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
